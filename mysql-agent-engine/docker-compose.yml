services:
  mysql:
    image: docker.m.daocloud.io/mysql:8.0
    container_name: mysql-agent-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-apppass}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=200
      - --slow-query-log=ON
      - --long-query-time=1
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - mysql-agent-net
    profiles: ["lab"]

  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:v2.48.0
    container_name: mysql-agent-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mysql-agent-net
    profiles: ["lab"]

  mysql-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: mysql-agent-engine:latest
    container_name: mysql-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://{host}:{port}/bsapp/api/v2/assistant/chat/completions}
      - LLM_API_KEY=${LLM_API_KEY:-sk-placeholder}
      - LLM_MODEL=${LLM_MODEL:-{LLM_API_MODEL_ID}}
      - INDEX_PATH=/app/data/vector_index
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=readonly
      - MYSQL_PASSWORD=${MYSQL_READONLY_PASSWORD:-readonlypass}
      - MYSQL_DATABASE=ecommerce
      - MYSQL_READONLY=1
    volumes:
      - ./data/vector_index:/app/data/vector_index:ro
      - ./logs:/app/logs
    networks:
      - mysql-agent-net
    profiles: ["app"]

  neo4j:
    image: neo4j:5.18-community
    container_name: mysql-agent-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mysql-agent}
    volumes:
      - neo4j_data:/data
    networks:
      - mysql-agent-net
    profiles: ["neo4j"]

networks:
  mysql-agent-net:
    driver: bridge

volumes:
  neo4j_data:
  mysql_data:
  prometheus_data:
