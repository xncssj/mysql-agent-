name: report_generation
version: "1.0"
description: |
  将根因、交叉判断、证据与时间线填充为结构化故障复盘报告（Markdown + JSON）。

cot_steps:
  - "汇总异常、根因排序、交叉命中"
  - "构建时间线与证据链"
  - "写清影响范围与止血/根治方案"
  - "列出后续改进项"
  - "输出 Markdown 与 JSON 双格式"

output_schema:
  type: object
  required: [title, severity, root_causes, remediation, markdown]
  properties:
    title: {type: string}
    severity: {type: string, enum: [CRITICAL, WARNING, INFO]}
    root_causes:
      type: array
      items: {type: object}
    remediation:
      type: array
      items: {type: string}
    markdown: {type: string}
