          note: "改写结果需过 SQL 解析器校验，防语义漂移"

  root_cause:
    current: "1.0"
    file: prompts/tasks/root_cause.yaml
    history:
      - version: "1.0"
        date: "2026-08-24"
        changes: "首版：RC01–RC18 规则表召回 + 证据链组织 + 反向验证"
        eval:
          golden_set: "eval/golden_set.jsonl"
          note: "以规则命中率与证据可回放为主要指标"

  instance_diagnosis:
    current: "1.0"
    file: prompts/tasks/instance_diagnosis.yaml
    history:
      - version: "1.0"
        date: "2026-08-24"
