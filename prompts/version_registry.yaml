        eval:
          golden_set: "eval/golden_set.jsonl"
          note: "区分 IO/SQL 线程、延迟、数据不一致三类"

  deadlock_analysis:
    current: "1.0"
    file: prompts/tasks/deadlock_analysis.yaml
    history:
      - version: "1.0"
