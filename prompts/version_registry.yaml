        eval:
          golden_set: "eval/golden_set.jsonl"
          note: "对应第 10 讲指标采集与异常检测"

  replication_diagnosis:
    current: "1.0"
    file: prompts/tasks/replication_diagnosis.yaml
    history:
      - version: "1.0"
