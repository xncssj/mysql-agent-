# Prompt 版本注册表
# 用途：tasks/*.yaml 的汇总视图 + 变更历史，支撑 A/B 分流与灰度回滚（第 16 讲 5.1）
# 约定：current 必须与对应 prompts/tasks/*.yaml 的 version 字段一致，改模板时两处同改
# 校验：scripts/check_prompt_versions.py 会比对本文件与 tasks 目录，不一致即报错

updated: "2026-11-13"
schema_version: 1

# A/B 分流默认比例（第 16 讲 5.2：按 session_id 哈希取模分流）
ab_default:
  split_ratio: 0.5
  min_sample_size: 100        # 低于此样本量只看趋势，不做显著性判断

versions:
  explain_diagnosis:
    current: "1.0"
    file: prompts/tasks/explain_diagnosis.yaml
    history:
      - version: "1.0"
        date: "2026-08-24"
        changes: "首版：四层 Prompt 结构 + CoT 步骤 + 固定输出 Schema"
        eval:
          golden_set: "eval/golden_set.jsonl（45 条）"
          note: "基线结果见 eval/baseline.json"

  index_advice:
    current: "1.0"
    file: prompts/tasks/index_advice.yaml
    history:
      - version: "1.0"
        date: "2026-08-24"
        changes: "首版：候选列 + 复合索引组合 + DDL 模板"
        eval:
          golden_set: "eval/golden_set.jsonl"
          note: "覆盖最左前缀、区分度、覆盖索引三类场景"

  sql_rewrite:
