        eval:
          golden_set: "手动抽检"
          note: "报告类输出以人工评分为主，暂不纳入自动打分"

# 演进示例（第 16 讲 5.1）
# 正文演示 explain_diagnosis 从 1.0 → 1.5 → 2.0 的迭代路径（静态 Few-shot → CoT → 动态 Few-shot + ReAct）。
# 该路径是设计目标，仓库当前仍为 1.0；每升一版须同步：
#   1) 改 tasks/explain_diagnosis.yaml 的 version
#   2) 在本文件追加 history 条目
#   3) 用 eval/compare_baseline.py 出前后对比
